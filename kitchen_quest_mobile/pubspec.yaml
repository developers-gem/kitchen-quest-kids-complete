name: kitchen_quest_mobile
description: Kitchen Quest Kids -- Flutter mobile app (iOS + Android)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management -- see docs/ARCHITECTURE.md for the Riverpod rationale
  flutter_riverpod: ^2.5.1

  # Routing, incl. deep link support
  go_router: ^14.2.0

  # HTTP client -- chosen over `http` for first-class interceptor support
  # (auth header injection, refresh-on-401, retry), which the API
  # integration requirements call for explicitly.
  dio: ^5.4.3+1

  # Secure token storage: refresh token in Keychain (iOS) / Keystore
  # (Android) -- never SharedPreferences, matching the backend's auth
  # architecture (the access token itself lives only in memory).
  flutter_secure_storage: ^9.2.2

  # Network status handling
  connectivity_plus: ^6.0.5

  # Offline cache for the grocery checklist
  shared_preferences: ^2.2.3

  # Local notifications (streak reminders, etc. surfaced on-device)
  flutter_local_notifications: ^17.2.2

  # Push notifications -- architecture/interface only in this deliverable;
  # wiring a real project requires `flutterfire configure` against an
  # actual Firebase project, which isn't something to fake. See
  # push_notification_service.dart's doc comment.
  firebase_messaging: ^15.1.0
  firebase_core: ^3.4.0

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
