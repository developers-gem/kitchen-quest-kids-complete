server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) -- any path that isn't a real
    # static file falls back to index.html so deep links (e.g. a password
    # reset email linking straight to /reset-password?token=...) work on
    # a hard refresh, not just via in-app navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for hashed build assets; index.html itself is
    # deliberately excluded so a new deploy is picked up on next visit
    # instead of being served stale from cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
